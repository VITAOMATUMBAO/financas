  s+='<line x1="'+pl+'" x2="'+W+'" y1="'+y(META)+'" y2="'+y(META)+'" stroke="var(--warn)" stroke-dasharray="4 3"/><line x1="'+pl+'" x2="'+W+'" y1="'+y(110000)+'" y2="'+y(110000)+'" stroke="var(--warn)" stroke-dasharray="4 3" opacity=".5"/>';
  ks.forEach(function(k,j){s+='<polyline fill="none" stroke="'+cols[j]+'" stroke-width="2" points="'+rows.map(function(r,i){return x(i)+','+y(+r[k])}).join(' ')+'"/>'});
  [0,6,12,18,22].forEach(function(i){if(rows[i])s+='<text x="'+x(i)+'" y="'+(H-4)+'" text-anchor="middle">'+mlabel(rows[i].mes)+'</text>'});
  s+='</svg>';var last=rows[rows.length-1],pc=Math.min(100,S.reserva/META*100);
  return '<div class="card"><h2>Reserva guardada hoje</h2><input id="res" inputmode="decimal" placeholder="Quanto você já guardou (R$)" value="'+(S.reserva||'')+'"><div class="big">'+fmt(S.reserva)+' <span class="sub">de '+fmt(META)+'</span></div><div class="bar"><i style="width:'+pc+'%;background:var(--c)"></i></div><div class="sub">'+Math.round(pc)+'% da meta · faltam '+fmt(Math.max(0,META-S.reserva))+'</div></div>'+
  '<div class="card"><h2>Projeção até set/28</h2><div class="sub"><span style="color:var(--mut)">■</span> só salário '+fmt(+last.so_salario)+' &nbsp;<span style="color:var(--b)">■</span> com Oasis '+fmt(+last.com_oasis)+' &nbsp;<span style="color:var(--c)">■</span> plano 74 mil '+fmt(+last.plano_74k)+'</div>'+s+'</div>'+
  '<div class="card"><h2>Quanto gastar por período</h2>'+TETO.map(function(t){return '<div class="row"><div class="l"><div>'+esc(t.periodo)+'</div><div class="sub">comprometido '+fmt(+t.comprometido)+'</div></div><div class="n"><b>'+fmt(+t.livre)+'</b><div class="sub">livre · teto '+fmt(+t.teto_total)+'</div></div></div>'}).join('')+'</div>'}
function vCfg(){
  return '<div class="card"><h2>Conexão com a Pluggy</h2><div class="sub" style="margin-bottom:8px">O Client Secret fica só neste aparelho. Ele não vai para o GitHub nem para ninguém.</div>'+
  '<label class="lbl">Client Secret</label><input id="sec" type="password" autocomplete="off" placeholder="Cole aqui" value="'+esc(secret())+'">'+
  '<label class="lbl">Client ID</label><input id="cid" value="'+esc(CFG.clientId)+'">'+
  '<label class="lbl">Item IDs dos bancos (separados por vírgula)</label><input id="its" value="'+esc(CFG.items.join(','))+'">'+
  '<label class="lbl">Seu nome nas transferências (para ignorar o que é seu)</label><input id="own" value="'+esc(CFG.own)+'">'+
  '<button class="btn" id="save">Salvar e carregar tudo</button> <button class="btn sec" id="clear">Limpar dados do aparelho</button></div>'+
  '<div class="card"><h2>Como isso funciona</h2><div class="msg">O app consulta a Pluggy direto do seu celular a cada '+CFG.refreshSec+' segundos enquanto está aberto. A Pluggy guarda o que os bancos informam pelo Open Finance; o botão "Pedir dados novos aos bancos" força uma nova leitura. Alguns bancos demoram para refletir uma compra, então "ao vivo" aqui quer dizer o mais novo que o banco liberou.</div></div>'}

function render(){
  var map={inicio:vInicio,fluxo:vProjecao,gastos:vGastos,cats:vCats,juros:vJuros,cartoes:vCartoes,proj:vProj,cfg:vCfg},v=$('#view');
  if(!S.tx.length&&S.tab!=='cfg'&&S.tab!=='proj'){v.innerHTML=(S.err?'<div class="alert bad">'+esc(S.err)+'</div>':'')+'<div class="card"><div class="sub">'+(secret()?'Carregando seus dados…':'Abra Ajustes e cole o Client Secret.')+'</div></div>';return}
  var y=window.scrollY;v.innerHTML=map[S.tab]();window.scrollTo(0,y);
  $('#stamp').textContent=S.last?'Atualizado há '+ago(S.last):'sem dados ainda';
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.t===S.tab)});
  bind()}
function bind(){
  var q=function(s,f){var e=$(s);if(e)e.onclick=f};
  q('#sync',syncBanks);
  var plf={'pl-entrada':['entrada',1],'pl-diario':['diario',1],'pl-bolsa':['bolsa',1],'pl-emprest':['emprest',1],'pl-peq':['peq',1],'pl-data':['entradaData',0]};
  Object.keys(plf).forEach(function(id){var e=$('#'+id);if(e)e.onchange=function(){var f=plf[id];if(f[1]){var v=pnum(e.value);PL[f[0]]=v==null?0:v}else PL[f[0]]=e.value;savePl();render()}});
  document.querySelectorAll('[data-pk]').forEach(function(b){b.onchange=function(){PLOK[b.dataset.pk]=b.checked;ls('fin-plano-ok',JSON.stringify(PLOK));render()}});
  document.querySelectorAll('[data-pv]').forEach(function(b){b.onclick=function(){S.pv=b.dataset.pv;render()}});
  var simf={'sm-renda0':['renda0',1],'sm-renda1':['renda1',1],'sm-extra':['extra',1],'sm-gasto':['gasto',1],'sm-rend':['rend',1],'sm-meta':['meta',1],'sm-ini':['ini',1],'sm-desde':['desde',0],'sm-extraDesde':['extraDesde',0],'sm-fim':['fim',0]};
  Object.keys(simf).forEach(function(id){var e=$('#'+id);if(e)e.onchange=function(){var f=simf[id];if(f[1]){var v=pnum(e.value);if(f[0]==='ini')SIM.ini=v;else SIM[f[0]]=v==null?0:v}else if(e.value)SIM[f[0]]=e.value;saveSim();render()}});
  document.querySelectorAll('[data-st]').forEach(function(b){b.onclick=function(){var p=b.dataset.st.split(':');SIM[p[0]]=Math.max(0,(+SIM[p[0]]||0)+(+p[1]));saveSim();render()}});
  document.querySelectorAll('[data-evdel]').forEach(function(b){b.onclick=function(){SIM.ev.splice(+b.dataset.evdel,1);saveSim();render()}});
  q('#evadd',function(){var m=$('#ev-m').value,v=pnum($('#ev-v').value),d=$('#ev-d').value.trim();if(m&&v!=null){SIM.ev.push({m:m,v:v,d:d});SIM.ev.sort(function(a,b){return a.m<b.m?-1:1});saveSim();render()}});
  q('#simreset',function(){SIM=JSON.parse(JSON.stringify(SIMD));saveSim();render()});
  document.querySelectorAll('[data-h]').forEach(function(b){b.onclick=function(){S.fh=+b.dataset.h;render()}});
  var oi=$('#oasis');if(oi)oi.onchange=function(){ls('fin-oasis',oi.checked?'1':'0');render()};
  var gi=$('#gasto');if(gi)gi.onchange=function(){ls('fin-gasto',String(parseFloat(String(gi.value).replace(',','.'))||''));render()};
  document.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){S.gview=b.dataset.g;render()}});
  document.querySelectorAll('[data-p]').forEach(function(b){b.onclick=function(){S.cper=b.dataset.p;render()}});
  document.querySelectorAll('[data-k]').forEach(function(b){b.onclick=function(){S.cdet=b.dataset.k;S.mdet=null;render();window.scrollTo(0,0)}});
  document.querySelectorAll('[data-mer]').forEach(function(b){b.onclick=function(){S.mdet=S.mdet===b.dataset.mer?null:b.dataset.mer;render()}});
  q('#mclear',function(){S.mdet=null;render()});
  q('#cback',function(){S.cdet=null;S.mdet=null;render()});
  document.querySelectorAll('[data-m]').forEach(function(b){b.onclick=function(){S.month=b.dataset.m;render()}});
  document.querySelectorAll('[data-c]').forEach(function(b){b.onclick=function(){S.cat=S.cat===b.dataset.c?null:b.dataset.c;render()}});
  var qi=$('#q');if(qi)qi.oninput=function(){S.q=qi.value;var p=qi.selectionStart;render();var n=$('#q');n.focus();n.setSelectionRange(p,p)};
  var ri=$('#res');if(ri)ri.onchange=function(){S.reserva=parseFloat(String(ri.value).replace(/\./g,'').replace(',','.'))||0;ls('fin-reserva',String(S.reserva));render()};
  q('#save',function(){ls('fin-secret',$('#sec').value.trim());CFG.clientId=$('#cid').value.trim();CFG.items=$('#its').value.split(',').map(function(s){return s.trim()}).filter(Boolean);CFG.own=$('#own').value.trim();saveCfg();KEY=null;S.tab='inicio';refresh(true)});
  q('#clear',function(){['fin-secret','fin-cache3','fin-cfg','fin-reserva'].forEach(function(k){ls(k,null)});S.tx=[];S.accounts=[];S.last=null;D={};render()})}
$('#nav').onclick=function(e){var b=e.target.closest('button');if(!b)return;S.tab=b.dataset.t;render();window.scrollTo(0,0)};
loadCache();derive();render();
if(secret())refresh(!S.tx.length);else{S.tab='cfg';render()}
setInterval(function(){if(!document.hidden&&secret()&&!S.busy&&S.tab!=='cfg')refresh(false)},CFG.refreshSec*1000);
document.addEventListener('visibilitychange',function(){if(!document.hidden&&secret()&&S.last&&Date.now()-new Date(S.last)>20000)refresh(false)});
})();
</script>
</body>
